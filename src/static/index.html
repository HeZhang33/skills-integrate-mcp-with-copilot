<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
      <div class="header-actions">
        <a href="statistics.html" class="stats-link">📊 View Statistics</a>
      </div>
    </header>

    <main>
      <!-- Registration Form at the Top -->
      <section id="signup-container" class="registration-panel">
        <h3>Quick Student Registration</h3>
        <form id="quick-signup-form">
          <div class="form-group">
            <label for="student-email">Student Email:</label>
            <input type="email" id="student-email" required placeholder="your-email@mergington.edu" />
          </div>
          <button type="button" id="set-email-btn">Set Email for Registration</button>
        </form>
        <div id="current-student" class="current-student" style="display: none;">
          <p>Registering as: <strong id="student-display"></strong></p>
          <button type="button" id="change-email-btn">Change Email</button>
        </div>
      </section>

      <!-- Activities List -->
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <!-- Message Display -->
      <div id="message" class="hidden"></div>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
